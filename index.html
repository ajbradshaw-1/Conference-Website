<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026 Moore Solid-Light Hybrids Workshop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@200;300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#1A2330;
    --navy-deep:#141B26;
    --accent:#4A7194;
    --accent-dark:#3A5A78;
    --ink:#2B3440;
    --muted:#69737F;
    --rule:#E3E7EC;
    --panel:#F6F8FA;
    --bg:#FFFFFF;
    --max:880px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:"Source Sans 3",-apple-system,"Helvetica Neue",Arial,sans-serif;
    color:var(--ink);background:var(--bg);
    font-size:17px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- header bar ---------- */
  .topbar{
    background:var(--navy);
    position:sticky;top:0;z-index:50;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .topbar-inner{
    max-width:1100px;margin:0 auto;padding:0 24px;
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:0 20px;min-height:54px;
  }
  .brand{
    color:#fff;text-decoration:none;font-weight:600;font-size:15px;
    letter-spacing:.04em;padding:14px 0;white-space:nowrap;
  }
  .brand span{color:#8FA9C0;font-weight:300}
  nav.main{display:flex;flex-wrap:wrap;gap:2px}
  nav.main a{
    color:#C7D2DC;text-decoration:none;font-size:14.5px;font-weight:400;
    padding:16px 13px;letter-spacing:.02em;border-bottom:3px solid transparent;
    transition:color .15s,border-color .15s;
  }
  nav.main a:hover{color:#fff}
  nav.main a.active{color:#fff;border-bottom-color:var(--accent)}
  nav.main a:focus-visible,.brand:focus-visible{outline:2px solid #8FB3D1;outline-offset:-2px}

  }
  .hero.tall{min-height:320px}
  .hero-content{position:relative;z-index:2;padding:48px 24px;max-width:900px}
  .hero h1{
    color:#fff;font-weight:200;letter-spacing:.045em;
    font-size:clamp(28px,4.6vw,46px);line-height:1.2;
  }
  .hero .sub{
    color:#B9C7D4;font-weight:300;font-size:clamp(15px,2vw,19px);
    letter-spacing:.12em;text-transform:uppercase;margin-top:14px;
  }
  .hero .sub .dot{color:var(--accent);padding:0 8px}

  /* ---------- page body ---------- */
  main{max-width:var(--max);margin:0 auto;padding:48px 24px 80px}
  h2{
    color:var(--accent-dark);font-weight:600;font-size:22px;letter-spacing:.01em;
    margin:44px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--rule);
  }
  main > section:first-child h2:first-child, main h2:first-child{margin-top:0}
  h3{font-weight:600;font-size:17.5px;margin:26px 0 8px;color:var(--ink)}
  p{margin:0 0 14px;max-width:72ch}
  a{color:var(--accent)}
  a:hover{color:var(--accent-dark)}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
  ul{margin:0 0 16px 22px}
  li{margin:5px 0}
  li::marker{color:var(--accent)}
  .lede{font-size:19px;font-weight:300;line-height:1.65;color:#3A4450}
  .small{font-size:14.5px;color:var(--muted)}
  .note{
    font-size:14.5px;color:var(--muted);background:var(--panel);
    border-left:3px solid var(--accent);padding:10px 14px;margin:18px 0;
  }
  .tba{
    display:inline-block;font-size:12px;font-weight:600;letter-spacing:.08em;
    color:var(--accent-dark);background:#EBF1F6;border:1px solid #D4E0EA;
    border-radius:3px;padding:0 7px;vertical-align:1px;text-transform:uppercase;
  }
  /* .tba variant for dark topbar (used by the working-title "Placeholder" pill) */
  .topbar .tba{color:#C7D2DC;background:rgba(255,255,255,.10);border-color:rgba(255,255,255,.22);font-size:10.5px;vertical-align:2px}

  /* at-a-glance */
  .glance{
    background:var(--panel);border:1px solid var(--rule);border-radius:4px;
    padding:22px 26px;margin:8px 0 10px;
  }
  .glance dl{display:grid;grid-template-columns:130px 1fr;row-gap:9px;column-gap:18px}
  .glance dt{font-weight:600;color:var(--accent-dark);font-size:15px;letter-spacing:.02em}
  .glance dd{margin:0;font-size:16px}
  @media (max-width:560px){.glance dl{grid-template-columns:1fr}.glance dt{margin-top:6px}}

  /* schedule tables */
  table.sched{width:100%;border-collapse:collapse;margin:6px 0 30px;font-size:15.5px}
  table.sched caption{
    text-align:left;font-weight:600;font-size:18px;color:var(--ink);
    padding:0 0 10px;letter-spacing:.01em;
  }
  table.sched caption .day{color:var(--accent-dark)}
  table.sched th{
    text-align:left;font-size:12.5px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted);
    border-bottom:2px solid var(--navy);padding:6px 10px;
  }
  table.sched td{border-bottom:1px solid var(--rule);padding:9px 10px;vertical-align:top}
  table.sched td.time{
    white-space:nowrap;width:165px;color:var(--accent-dark);
    font-variant-numeric:tabular-nums;font-weight:600;font-size:14.5px;
  }
  tr.sesshead td{font-weight:600;background:#F2F5F8;color:var(--ink)}
  tr.talk td.item{padding-left:26px}
  tr.talk td.time{font-weight:400;color:var(--muted)}
  tr.break td{color:var(--muted);background:#FAFBFC}
  tr.discuss td{background:#EFF4F8}
  tr.social td{background:#FAFBFC}
  .talks{color:var(--muted);font-size:14px;display:block;margin-top:2px}
  @media (max-width:560px){
    table.sched td.time{width:auto;font-size:13.5px}
    table.sched{font-size:14.5px}
  }

  /* speakers */
  ol.speakers{list-style:none;margin:10px 0 0;padding:0;columns:2;column-gap:48px}
  ol.speakers li{
    break-inside:avoid;border-bottom:1px solid var(--rule);
    padding:10px 2px;margin:0;
  }
  ol.speakers .aff{display:block;font-size:14.5px;color:var(--muted)}
  @media (max-width:640px){ol.speakers{columns:1}}

  /* sponsors */
  .sponsor-primary{
    border:1px solid var(--rule);border-top:4px solid var(--accent);
    border-radius:4px;padding:34px 30px;text-align:center;margin:14px 0 26px;
    background:var(--panel);
  }
  .sponsor-primary .mark{
    font-weight:200;font-size:clamp(24px,3.4vw,34px);letter-spacing:.03em;
    color:var(--navy);line-height:1.25;
  }
  .sponsor-primary .role{
    font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent-dark);margin-bottom:12px;
  }
  .sponsor-primary img.logo{max-width:340px;width:78%;height:auto;display:block;margin:0 auto}
  .cell img.logo{height:48px;width:auto;max-width:100%;display:block}
  .mark-fallback{display:none}
  .map-embed{width:100%;height:380px;border:1px solid var(--rule);border-radius:4px;display:block;margin:10px 0 6px}
  /* venue photo gallery */
  .venue-photos{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));
    gap:14px;margin:16px 0 6px;
  }
  .vphoto{margin:0;border:1px solid var(--rule);border-radius:4px;overflow:hidden;background:#fff}
  .vphoto img{width:100%;height:185px;object-fit:cover;display:block}
  .vphoto figcaption{font-size:13px;color:var(--muted);padding:8px 10px;text-align:center;border-top:1px solid var(--rule)}
  .vphoto .ph{display:none}
  .vphoto.empty{border-style:dashed}
  .vphoto.empty img{display:none}
  .vphoto.empty .ph{
    display:flex;align-items:center;justify-content:center;height:185px;
    background:var(--panel);color:var(--muted);font-size:13px;letter-spacing:.04em;
    text-align:center;padding:0 14px;
  }
  .sponsor-row{
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:24px 32px;margin:8px 0 10px;padding:26px 20px;
    border:1px solid var(--rule);border-radius:4px;background:var(--panel);
  }
  .sponsor-row .cell{
    text-align:center;font-weight:300;font-size:17px;color:#3A4450;
    display:flex;align-items:center;justify-content:center;line-height:1.35;
  }
  .sponsor-home{display:flex;flex-wrap:wrap;align-items:stretch;gap:14px;margin-top:10px}

  /* history */
  .edition{
    border:1px dashed #CBD5DE;border-radius:4px;padding:20px 24px;margin:14px 0;
    color:var(--muted);
  }
  .edition .yr{font-weight:600;color:var(--accent-dark);font-size:15px;letter-spacing:.06em}

  footer{
    border-top:1px solid var(--rule);background:var(--panel);
    padding:28px 24px;font-size:14px;color:var(--muted);
  }
  .footer-inner{max-width:var(--max);margin:0 auto;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px 24px}

  .actions{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 22px}
  .btn{
    display:inline-block;font-size:14px;font-weight:600;letter-spacing:.03em;
    color:var(--accent-dark);border:1px solid #C9D7E2;border-radius:3px;
    padding:7px 14px;text-decoration:none;background:#fff;cursor:pointer;
    font-family:inherit;
  }
  .btn:hover{border-color:var(--accent);color:var(--accent-dark)}

  @media (prefers-reduced-motion:no-preference){
    .hero-content{animation:rise .5s ease-out both}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  }

about: `
  <p class="lede">This workshop is convened at a moment of rapid growth for cavity
  quantum electrodynamics in quantum materials.</p>

  <h2>Workshop Background</h2>
  <p>Over the past several years, the idea that the quantum fluctuations of light
  confined in an optical cavity can reshape the ground states of solids has moved
  from theoretical proposal to experimental frontier. Reports of cavity-modified
  transport, metal-to-insulator transitions, and proposals for cavity-engineered
  superconductivity and topology now appear at a pace of roughly one major result
  per month, drawing together communities from ultrafast spectroscopy, condensed
  matter theory, quantum optics, and materials synthesis.</p>
  <p>This invitation-only workshop gathers about two dozen leading contributors to
  that emerging field for invited talks and open discussion. The format is
  deliberately small and closed-door: talks may include unpublished results.
  Two discussion sessions focus on how cavities control superconductivity — and
  how to confirm experimentally that the cavity is responsible — and on how
  cavities control topology and many-body physics.</p>
  <p>The 2026 meeting continues the Moore Foundation–supported series
  "Workshop on Solid-Light Hybrid States of Matter," following earlier editions
  at Stanford University (2024) and the CUNY Graduate Center (2025). See
  <a href="#/history">Conference History</a>.</p>
`,

  <h2>Getting to Hyde Park</h2>

  <h3>From O'Hare International Airport (ORD)</h3>
  <ul>
    <li>Car / ride-share: approximately 45 minutes (longer in rush hour).</li>
    <li>Public transit: CTA Blue Line into downtown, then Metra Electric or CTA bus to Hyde Park.</li>
  </ul>

  <h3>From Chicago Midway International Airport (MDW)</h3>
  <p>Midway is the closest airport to Hyde Park — roughly 10 miles west.</p>
  <ul>
    <li>Car / ride-share: approximately 20–25 minutes via I-55 East to Lake Shore Drive South. This is the most convenient option from Midway.</li>
    <li>Public transit option 1: CTA Orange Line to Roosevelt, transfer to the Green Line southbound to the Garfield (51st) station, then CTA bus #55 east toward the lake. Total approximately 50–60 minutes.</li>
    <li>Public transit option 2: CTA Orange Line into the Loop, then Metra Electric from Millennium Station to the 55th–56th–57th Street station. Total approximately 50–60 minutes.</li>
  </ul>

  <h3>From downtown Chicago</h3>
  <ul>
    <li>Metra Electric District (from Millennium Station) to the 55th–56th–57th Street station — about 12 minutes.</li>
    <li>CTA Bus #6 (Jackson Park Express) along the lakefront.</li>
  </ul>

  <h2>Around Hyde Park</h2>
  <p>Hyde Park is a historic neighborhood on Chicago's South Side and home to the
  University of Chicago. Within walking distance of the venue:</p>
  <ul>
    <li><strong>University of Chicago campus</strong> — gothic quads and Rockefeller Memorial Chapel.</li>

  <p class="lede">This workshop is convened at a moment of rapid growth for cavity
  quantum electrodynamics in quantum materials.</p>

  <h2>Workshop Background</h2>
  <p>Over the past several years, the idea that the quantum fluctuations of light
  confined in an optical cavity can reshape the ground states of solids has moved
  from theoretical proposal to experimental frontier. Reports of cavity-modified
  transport, metal-to-insulator transitions, and proposals for cavity-engineered
  superconductivity and topology now appear at a pace of roughly one major result
  per month, drawing together communities from ultrafast spectroscopy, condensed
  matter theory, quantum optics, and materials synthesis.</p>
  <p>This workshop gathers approximately two dozen leading contributors to that
  emerging field for three days of invited talks and open discussion. The format
  is deliberately small and closed-door: talks may include unpublished results,
  and the two discussion sessions are intended to identify where cavity control
  of correlated states — superconductivity, density waves, Mott physics — and
  cavity-induced topology can move next.</p>
  <p>The organizers intend this meeting to seed an ongoing series; future editions
  will be archived on this page.</p>
  ============ end MODE B ============ -->
