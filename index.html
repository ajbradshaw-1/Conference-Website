<style>
  :root{

    --navy-deep:#141B26;
    --accent:#4A7194;

    --muted:#69737F;
    --rule:#E3E7EC;

    --bg:#FFFFFF;

  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{

    font-size:17px;line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- header bar ---------- */
  .topbar{
    background:var(--navy);
    position:sticky;top:0;z-index:50;
    border-bottom:1px solid rgba(255,255,255,.06);
  }
  .topbar-inner{
    max-width:1100px;margin:0 auto;padding:0 24px;
    display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:0 20px;min-height:54px;
  }
  .brand{
    color:#fff;text-decoration:none;font-weight:600;font-size:15px;
    letter-spacing:.04em;padding:14px 0;white-space:nowrap;
  }
  .brand span{color:#8FA9C0;font-weight:300}
  nav.main{display:flex;flex-wrap:wrap;gap:2px}
  nav.main a{
    color:#C7D2DC;text-decoration:none;font-size:14.5px;font-weight:400;
    padding:16px 13px;letter-spacing:.02em;border-bottom:3px solid transparent;
    transition:color .15s,border-color .15s;
  }
  nav.main a:hover{color:#fff}
  nav.main a.active{color:#fff;border-bottom-color:var(--accent)}
  nav.main a:focus-visible,.brand:focus-visible{outline:2px solid #8FB3D1;outline-offset:-2px}

  /* ---------- hero ---------- */
  .hero{
    position:relative;background:var(--navy-deep);
    min-height:240px;display:flex;align-items:center;justify-content:center;
    overflow:hidden;text-align:center;
  }
  .hero.tall{min-height:320px}
  .hero svg.banner{position:absolute;inset:0;width:100%;height:100%;display:block}
  .hero-content{position:relative;z-index:2;padding:48px 24px;max-width:900px}
  .hero h1{
    color:#fff;font-weight:200;letter-spacing:.045em;
    font-size:clamp(28px,4.6vw,46px);line-height:1.2;
  }
  .hero .sub{
    color:#B9C7D4;font-weight:300;font-size:clamp(15px,2vw,19px);
    letter-spacing:.12em;text-transform:uppercase;margin-top:14px;
  }
  .hero .sub .dot{color:var(--accent);padding:0 8px}

  /* ---------- page body ---------- */
  main{max-width:var(--max);margin:0 auto;padding:48px 24px 80px}
  h2{
    color:var(--accent-dark);font-weight:600;font-size:22px;letter-spacing:.01em;
    margin:44px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--rule);

  h3{font-weight:600;font-size:17.5px;margin:26px 0 8px;color:var(--ink)}
  p{margin:0 0 14px;max-width:72ch}
  a{color:var(--accent)}
  a:hover{color:var(--accent-dark)}
  a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
  ul{margin:0 0 16px 22px}
  li{margin:5px 0}
  li::marker{color:var(--accent)}
  .lede{font-size:19px;font-weight:300;line-height:1.65;color:#3A4450}
  .small{font-size:14.5px;color:var(--muted)}
  .note{
    font-size:14.5px;color:var(--muted);background:var(--panel);
    border-left:3px solid var(--accent);padding:10px 14px;margin:18px 0;
  }
  .tba{
    display:inline-block;font-size:12px;font-weight:600;letter-spacing:.08em;
    color:var(--accent-dark);background:#EBF1F6;border:1px solid #D4E0EA;
    border-radius:3px;padding:0 7px;vertical-align:1px;text-transform:uppercase;

    background:var(--panel);border:1px solid var(--rule);border-radius:4px;

  .glance dt{font-weight:600;color:var(--accent-dark);font-size:15px;letter-spacing:.02em}
  .glance dd{margin:0;font-size:16px}

  table.sched{width:100%;border-collapse:collapse;margin:6px 0 30px;font-size:15.5px}
  table.sched caption{
    text-align:left;font-weight:600;font-size:18px;color:var(--ink);
    padding:0 0 10px;letter-spacing:.01em;
  }
  table.sched caption .day{color:var(--accent-dark)}
  table.sched th{
    text-align:left;font-size:12.5px;font-weight:600;letter-spacing:.09em;
    text-transform:uppercase;color:var(--muted);
    border-bottom:2px solid var(--navy);padding:6px 10px;
  }
  table.sched td{border-bottom:1px solid var(--rule);padding:9px 10px;vertical-align:top}
  table.sched td.time{
    white-space:nowrap;width:165px;color:var(--accent-dark);
    font-variant-numeric:tabular-nums;font-weight:600;font-size:14.5px;
  }

  tr.talk td.item{padding-left:26px}
  tr.talk td.time{font-weight:400;color:var(--muted)}
  tr.break td{color:var(--muted);background:#FAFBFC}
  tr.discuss td{background:#EFF4F8}
  tr.social td{background:#FAFBFC}
  .talks{color:var(--muted);font-size:14px;display:block;margin-top:2px}

  ol.speakers{list-style:none;margin:10px 0 0;padding:0;columns:2;column-gap:48px}
  ol.speakers li{
    break-inside:avoid;border-bottom:1px solid var(--rule);
    padding:10px 2px;margin:0;
  }
  ol.speakers .aff{display:block;font-size:14.5px;color:var(--muted)}
  @media (max-width:640px){ol.speakers{columns:1}}

  /* sponsors */
  .sponsor-primary{
    border:1px solid var(--rule);border-top:4px solid var(--accent);
    border-radius:4px;padding:34px 30px;text-align:center;margin:14px 0 26px;
    background:var(--panel);

    color:var(--navy);line-height:1.25;

    font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent-dark);margin-bottom:12px;
  }

  .cell img.logo{max-width:190px;max-height:52px;width:auto;height:auto}
  .mark-fallback{display:none}
  .map-embed{width:100%;height:380px;border:1px solid var(--rule);border-radius:4px;display:block;margin:10px 0 6px}
  .sponsor-row{

    line-height:1.35;

  /* history */
  .edition{
    border:1px dashed #CBD5DE;border-radius:4px;padding:20px 24px;margin:14px 0;
    color:var(--muted);
  }

    padding:28px 24px;font-size:14px;color:var(--muted);

  .actions{display:flex;gap:12px;flex-wrap:wrap;margin:6px 0 22px}
  .btn{
    display:inline-block;font-size:14px;font-weight:600;letter-spacing:.03em;
    color:var(--accent-dark);border:1px solid #C9D7E2;border-radius:3px;

  .btn:hover{border-color:var(--accent);color:var(--accent-dark)}

    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

  @media print{
    .topbar,footer,.actions,.map-embed{display:none}

    .hero h1,.hero .sub{color:#000}
    .hero-content{padding:0 0 12px}
    main{padding:0;max-width:100%}
    table.sched{page-break-inside:avoid;font-size:12px}

    body{font-size:12.5px}
  }
</style>
